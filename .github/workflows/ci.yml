name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Install server deps
        run: npm ci
        working-directory: server

      # Root ESLint config covers both src/ and server/src/
      - name: Lint
        run: npm run lint

      # tsc -b typecheck + vite build (VITE_ vars are only needed at runtime, not to compile)
      - name: Build frontend
        run: npm run build

      - name: Build server
        run: npm run build
        working-directory: server
