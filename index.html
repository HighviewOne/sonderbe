<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SonderBe helps California homeowners prevent foreclosure. Learn about your options including loan modification, forbearance, and more. Free guidance and resources." />
    <meta name="keywords" content="foreclosure prevention, California foreclosure help, loan modification, forbearance, mortgage assistance, stop foreclosure" />
    <title>SonderBe | Foreclosure Prevention Help for California Homeowners</title>
    <script>
      // Apply a saved light/dark choice before first paint (no flash). Default: follow the device.
      try {
        var t = localStorage.getItem('sonderbe-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
